[project]
name = "ev-charger-scheduling-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI's dependency injection relies on calls in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "experiments", "scripts"]
# backend/alembic is the migrations folder, not the package.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: integration tests requiring a running Postgres/PostGIS container",
]
