services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: evdb
      POSTGRES_USER: evuser
      POSTGRES_PASSWORD: evpass
    ports:
      # 5433 on the host, because a locally installed Postgres usually holds 5432.
      # The backend reaches the database at db:5432 over the compose network either way.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evuser -d evdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://evuser:evpass@db:5432/evdb
      OSRM_BASE_URL: http://osrm:5000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      OPENCHARGEMAP_API_KEY: ${OPENCHARGEMAP_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      # File-change events do not cross Docker Desktop bind mounts on Windows and
      # macOS, so --reload polls instead.
      WATCHFILES_FORCE_POLLING: "true"
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Read-only access to the OSM extract, for building the Dijkstra road graph.
      - osrmdata:/osm:ro
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Downloads a pinned Greater London OpenStreetMap snapshot once. Pinning keeps
  # the road network, and so every travel time, identical across machines.
  # The OSRM image ships without wget or curl, hence a separate container.
  osm-download:
    image: curlimages/curl:8.15.0
    user: root
    volumes:
      - osrmdata:/data
    command:
      - sh
      - -euc
      - |
        if [ -f /data/london.osm.pbf ]; then echo "London extract already downloaded."; exit 0; fi
        echo "Downloading the Greater London OSM extract (about 120 MB)..."
        curl -fsSL --retry 3 -o /data/london.osm.pbf.part           https://download.geofabrik.de/europe/united-kingdom/england/greater-london-260101.osm.pbf
        mv /data/london.osm.pbf.part /data/london.osm.pbf

  osrm-prep:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-debian
    working_dir: /data
    depends_on:
      osm-download:
        condition: service_completed_successfully
    volumes:
      - osrmdata:/data
    command:
      - sh
      - -euc
      - |
        if [ -f /data/london.osrm.mldgr ]; then echo "OSRM data already prepared."; exit 0; fi
        osrm-extract -p /opt/car.lua /data/london.osm.pbf
        osrm-partition /data/london.osrm
        osrm-customize /data/london.osrm

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-debian
    working_dir: /data
    depends_on:
      osrm-prep:
        condition: service_completed_successfully
    volumes:
      - osrmdata:/data
    ports:
      - "5000:5000"
    command: osrm-routed --algorithm mld /data/london.osrm

  frontend:
    build:
      context: ./frontend
    environment:
      # Same reason as the backend: poll so edits on the host trigger hot reload.
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pgdata:
  osrmdata:
